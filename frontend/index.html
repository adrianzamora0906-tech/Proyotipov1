    /* Loading Animation */

      justify-content: center;

      color: white;
      font-weight: 700;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1rem;
    }

    .admin-dashboard [hidden] {

    }

    .activity-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      margin-top: 1rem;
    }

    .activity-pagination > span { display: flex; gap: .35rem; }

    .activity-page {
      min-width: 34px;
      height: 34px;
      padding: 0 .55rem;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      background: white;
      color: #344054;
      cursor: pointer;
    }

    .activity-page.is-active { border-color: #4f46e5; background: #4f46e5; color: white; }
    .activity-page:disabled { cursor: not-allowed; opacity: .45; }
    .activity-pagination__summary { margin: .55rem 0 0; text-align: center; color: #667085; font-size: .72rem; }
    .permission-menu-impact { display:block; margin-top:.3rem; color:#4338ca; font-size:.67rem; font-style:normal; font-weight:600; }
